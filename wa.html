<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Membuka WhatsApp…</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root { --wine: #4a0f1c; --cream: #ede6dd; --ink: #3a2a2c; color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--cream); color: var(--ink); font: 15px/1.6 system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  a { display: inline-block; margin-top: 14px; background: #1f7a4d; color: #fff; text-decoration: none; padding: 12px 22px; border-radius: 999px; font-weight: 600; }
  small { display: block; margin-top: 12px; color: #6f6264; }
</style>
</head>
<body>
<main>
  <p>Menyiapkan pesan undangan untuk<br><b id="who"></b></p>
  <a id="go" href="#">Buka WhatsApp</a>
  <small>Jika WhatsApp tidak terbuka otomatis, tekan tombol di atas.</small>
</main>
<script>
// Short link used by the Excel guest list: /wa?n=62812...&to=Nama+Tamu
// Builds the invitation message here, because Excel cannot hold the full WhatsApp URL in a formula.
const MSG = `Assalamu'alaikum Warahmatullahi Wabarakatuh

Kepada Yth.
Bapak/Ibu/Saudara/i *{nama}*

Tanpa mengurangi rasa hormat, perkenankan kami mengundang Bapak/Ibu/Saudara/i untuk menghadiri acara pernikahan kami:

*Sifa & Yoga*
Minggu, 27 Desember 2026
Sakha Ballroom, Royal Sentul Park

Info lengkap acara dan konfirmasi kehadiran:
{link}

Merupakan suatu kehormatan dan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir dan memberikan doa restu.

Wassalamu'alaikum Warahmatullahi Wabarakatuh

Kami yang berbahagia,
Sifa & Yoga`;
// The client edits the message in the "Pesan WA" tab of the Google Sheet; this page reads it
// through the same Apps Script used for guest wishes. The built-in MSG above is the fallback.
const ENDPOINT = "https://script.google.com/macros/s/AKfycbxVuNL1l7NikrR7EizfKegPu8Zk6bl2G69mFRMYCCk3sR--DcNxfgpYrmUuib8rAkkI/exec";
async function loadTemplate() {
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 4000);
    const r = await fetch(ENDPOINT + "?pesan=1&t=" + Date.now(), { cache: "no-store", signal: ctl.signal });
    clearTimeout(t);
    const d = await r.json();
    return d && typeof d.pesan === "string" && d.pesan.trim() ? d.pesan : MSG;
  } catch { return MSG; }
}
const q = new URLSearchParams(location.search);
const name = (q.get("to") || "").trim().slice(0, 80);
let num = (q.get("n") || "").replace(/\D/g, "");
if (num.startsWith("0")) num = "62" + num.slice(1); else if (num.startsWith("8")) num = "62" + num;
const link = "https://sifayoga.web.id/?to=" + encodeURIComponent(name).replace(/%20/g, "+");
document.getElementById("who").textContent = name;
loadTemplate().then(tpl => {
  const text = tpl.replaceAll("{nama}", name || "Bapak/Ibu/Saudara/i").replaceAll("{link}", name ? link : "https://sifayoga.web.id/");
  const url = (num ? "https://wa.me/" + num : "https://wa.me/") + "?text=" + encodeURIComponent(text);
  document.getElementById("go").href = url;
  location.replace(url);
});
</script>
</body>
</html>
